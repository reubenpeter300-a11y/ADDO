workflows:
  addo-manager-android-debug:
    name: ADDO Manager Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Generate missing Android platform project
        script: flutter create --platforms=android --org tz.reubentech .
      - name: Verify Flutter and Android build environment
        script: |
          flutter --version
          flutter doctor -v
          java -version
      - name: Resolve Flutter packages
        script: flutter pub get
      - name: Analyze source
        script: flutter analyze
      - name: Build installable APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
